name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest discover -s tests -v
      - name: Dispatch smoke
        run: python3 tools/reproduce.py --model dispatch --mode smoke --order forward --output outputs/dispatch-smoke
      - name: CY smoke
        run: python3 tools/reproduce.py --model cy --mode smoke --order forward --output outputs/cy-smoke
